name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      # Step 1: Check out your repository code so the runner can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js on the runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your required version (e.g., 18, 20, 22, or 'lts/*')
          cache: 'npm'       # Automatically caches your node_modules for faster subsequent runs

      # Step 3: Clean install dependencies using your package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run your project tests (Optional)
      - name: Run tests
        run: npm test --if-present
